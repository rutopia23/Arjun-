name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [core-api, reasoning, voice-agent, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pytest ruff httpx
          for f in services/${{ matrix.svc }}/requirements*.txt; do pip install -r "$f"; done
          pip install jsonschema
      - name: Ruff
        run: ruff check .
      - name: Tests
        working-directory: services/${{ matrix.svc }}
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test --if-present -- --run
